<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section>
					<h1>¡Soy Informático!</h1>
					<img src="images/presentacion.png" alt="Presentación personal">
				</section>
				<section>
					<h2>El despertar del interes</h2>
					<img src="images/inicios.png" alt="El despertar del interes">
				</section>
				<section>
					<section>
					<h2>Estapa académica</h2>
					<img src="images/academica.png" alt="Estapa académica">
					</section>
									<section>
					<h2>Estructura de empresa IT</h2>
					<div class="r-stack">
					<img
						class="fragment fade-in"
						data-fragment-index="0"
						src="images/emp_1.png"
					/>
					<img
						class="fragment fade-in"
						data-fragment-index="1"
						src="images/emp_2.png"
					/>
					<img
						class="fragment fade-in"
						data-fragment-index="2"
						src="images/emp_3.png"
					/>
					<img
						class="fragment fade-in"
						data-fragment-index="3"
						src="images/emp_4.png"
					/>
					<img
						class="fragment fade-in"
						data-fragment-index="4"
						src="images/emp_5.png"
					/>
					<img
						class="fragment fade-in"
						data-fragment-index="5"
						src="images/emp_6.png"
					/>
					</div>
				</section>
				</section>
				<section>
					<h2>Carrera profesional</h2>
					<img src="images/carrera.png" alt="Carrera profesional">
				</section>
				<section>
					<h2>El futuro</h2>
					<img src="images/futuro.png" alt="El futuro">
				</section>
				<section>
					<h2>Preguntas???</h2>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
